<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>The Blues Archive</title>

<style>

body{
    margin:0;
    overflow:hidden;
    background:#1e1712;
    font-family:Georgia, serif;
}

.container{
    position:relative;
    width:100vw;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.bg{
    width:100vw;
    height:100vh;
    object-fit:cover;
    display:block;
}
.year{
    position:absolute;
    width:52px;
    height:52px;
    border-radius:6px;
    z-index:10;
    transition:0.2s;
}
.year{
    border:2px solid yellow;
}

/* 1926 */

.y1926{
    left:2%;
    top:10%;
}

.y1927{
    left:23%;
    top:49%;
}
</style>
</head>

<body>

<div class="container">

<img class="bg" src="homepage-final.png"

<a class="year y1926" href="https://google.com">A</a>
</div>
</body>
</body>
</html>
