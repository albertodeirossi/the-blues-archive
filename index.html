<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>The Blues Archive</title>

<style>

body{
    margin:0;
    overflow:hidden;
    background:#1e1712;
    font-family:Georgia, serif;
}

/* CONTENITORE */

.container{
    position:relative;
    width:100vw;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

/* IMMAGINE */

.bg{
    width:100vw;
    height:100vh;
    object-fit:contain;
    display:block;
}

/* overlay leggerissimo */

.container:before{
    content:"";
    position:absolute;
    inset:0;
    background:rgba(0,0,0,0.06);
    pointer-events:none;
}

/* ANNI */

.year{
    position:absolute;
    width:90px;
    height:90px;
    border-radius:10px;
    transition:0.25s;
    z-index:10;
}

.year:hover{
    background:rgba(255,230,180,0.18);
    box-shadow:0 0 20px rgba(255,220,150,0.35);
}

/* POSIZIONE 1926 */

.y1926{
    left:17.2%;
    top:49.5%;
}

</style>
</head>

<body>

<div class="container">

<img class="bg" src="homepage.png">

<a class="year y1926" href="1926.html"></a>

</div>

</body>
</html>
